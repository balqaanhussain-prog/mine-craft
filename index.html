<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Web Minecraft Engine</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: monospace;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h3>Mini WebCraft Sandbox</h3>
        <p>Use Mouse to look around (Click canvas to lock pointer)</p>
    </div>

    <!-- Import Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Scene, Camera, and Renderer Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Add Ambient and Directional Lighting (Sunlight)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(20, 40, 20);
        scene.add(sunLight);

        // 3. Create a Simple Voxel Terrain (Grass and Dirt blocks)
        const blockSize = 1;
        const geometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
        
        // Simple color materials for blocks
        const grassMaterial = new THREE.MeshLambertMaterial({ color: 0x559033 });
        const dirtMaterial = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
        const stoneMaterial = new THREE.MeshLambertMaterial({ color: 0x7f7f7f });

        // Generate a small flat terrain grid
        const worldSize = 10;
        for (let x = -worldSize; x < worldSize; x++) {
            for (let z = -worldSize; z < worldSize; z++) {
                // Grass layer top
                let block = new THREE.Mesh(geometry, grassMaterial);
                block.position.set(x * blockSize, 0, z * blockSize);
                scene.add(block);

                // Dirt layer underneath
                let dirt = new THREE.Mesh(geometry, dirtMaterial);
                dirt.position.set(x * blockSize, -1, z * blockSize);
                scene.add(dirt);

                // Stone foundation
                let stone = new THREE.Mesh(geometry, stoneMaterial);
                stone.position.set(x * blockSize, -2, z * blockSize);
                scene.add(stone);
            }
        }

        // 4. Render Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
