<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Web GTA Sandbox</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        #hud {
            position: absolute; top: 15px; left: 15px; color: #fff;
            background: rgba(0,0,0,0.7); padding: 12px 18px; border-radius: 6px;
            border-left: 4px solid #f39c12; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="hud">
        <strong>MINI GTA 3D</strong><br>
        Controls: <b>W/S</b> Accelerate/Brake | <b>A/D</b> Steer | <b>Space</b> Handbrake
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Scene & Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 40, 200);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(50, 100, 50);
        scene.add(sun);

        // 3. City Ground & Roads
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(400, 400),
            new THREE.MeshLambertMaterial({ color: 0x2c3e50 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Procedural City Buildings
        const bMat = new THREE.MeshLambertMaterial({ color: 0x7f8c8d });
        for (let x = -120; x <= 120; x += 40) {
            for (let z = -120; z <= 120; z += 40) {
                if (Math.abs(x) < 25 && Math.abs(z) < 25) continue; // Leave spawn clear
                const h = 15 + Math.random() * 45;
                const building = new THREE.Mesh(new THREE.BoxGeometry(22, h, 22), bMat);
                building.position.set(x, h / 2, z);
                scene.add(building);
            }
        }

        // 4. Player Car
        const car = new THREE.Group();
        const body = new THREE.Mesh(
            new THREE.BoxGeometry(2.2, 0.8, 4.4),
            new THREE.MeshLambertMaterial({ color: 0xe74c3c })
        );
        body.position.y = 0.6;
        const cabin = new THREE.Mesh(
            new THREE.BoxGeometry(1.8, 0.7, 2.2),
            new THREE.MeshLambertMaterial({ color: 0x222222 })
        );
        cabin.position.set(0, 1.3, -0.2);
        car.add(body, cabin);
        scene.add(car);

        // 5. Driving Physics & Controls
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        let speed = 0;
        const maxSpeed = 0.9;
        const accel = 0.025;
        const friction = 0.96;

        function animate() {
            requestAnimationFrame(animate);

            if (keys['KeyW'] || keys['ArrowUp']) speed += accel;
            if (keys['KeyS'] || keys['ArrowDown']) speed -= accel;
            if (keys['Space']) speed *= 0.85;

            speed = Math.max(-maxSpeed / 2, Math.min(maxSpeed, speed));
            speed *= friction;

            if (Math.abs(speed) > 0.01) {
                const turnDir = speed > 0 ? 1 : -1;
                if (keys['KeyA'] || keys['ArrowLeft']) car.rotation.y += 0.04 * turnDir;
                if (keys['KeyD'] || keys['ArrowRight']) car.rotation.y -= 0.04 * turnDir;
            }

            car.position.x -= Math.sin(car.rotation.y) * speed;
            car.position.z -= Math.cos(car.rotation.y) * speed;

            // Third-person chase camera
            const camOffset = new THREE.Vector3(0, 5, 11).applyAxisAngle(new THREE.Vector3(0, 1, 0), car.rotation.y);
            camera.position.lerp(car.position.clone().add(camOffset), 0.15);
            camera.lookAt(car.position.x, car.position.y + 1, car.position.z);

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
